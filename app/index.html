<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/rvu-logo-gold.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="RVU Connect, reimagined: events, clubs, projects and notices at RV University, in the order you need them." />
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("rvu-connect:theme-v2"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = "light"; // first visit opens in the light theme
        var r = document.documentElement;
        r.dataset.theme = t;
        r.style.colorScheme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F4F0E6");
      })();
    </script>
    <style>
      html { background: #000000; }
      html[data-theme="light"] { background: #F4F0E6; }
    </style>
    <title>RVU Connect · RV University</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
